name: sales-followup
description: 고객 미팅·통화 raw 노트에서 다음 액션·약속·답변 필요한 질문을 정리하고 follow-up 메일 초안 + 다음 일정 제안까지 만듭니다.
persona: 자영업 B ★★★
stressRelieved: 미팅 끝나고 머릿속 흩어진 액션·약속·다음 일정을 메모로 못 옮기는 부담
steps:
  - type: shell
    name: load-notes
    command: |
      node -e "process.stdout.write(require('fs').readFileSync('workflows/fixtures/client-meeting-2026-w22.md','utf8'))"

  - type: llm
    name: extract-actions
    prompt: |
      You are a Korean 1인 자영업/freelancer reviewing your own raw notes from
      a client meeting. Reorganize the notes into a structured action sheet
      with these four sections (Korean Markdown, 1–3 lines each):

      1. **결정 사항** — 이번 미팅에서 확정된 것. 한 줄로 (예: "컨셉 A로 최종 결정").
      2. **내가 해야 할 것 (마감 포함)** — 본인이 책임지는 액션. 각 항목:
         `- [ ] <마감일 YYYY-MM-DD> <액션> — <누구에게/어디로>`
      3. **고객이 보내주기로 한 것** — 고객 측 액션. 같은 체크박스 + 마감일 형식.
      4. **추가 견적·범위 변경 필요** — brief에 없던 추가 요청. 항목 + 산정 근거 한 줄.

      Rules:
      - 마감일이 노트에 있으면 ISO 형식(YYYY-MM-DD)으로. 없으면 "미정".
      - 본인 추정·내부 메모(예: 단가 산정 메모)는 출력에 포함하되 "(내부)" 표기.
      - 노트의 "분위기/사이드" 같은 비공식 정보는 별도 5번째 섹션 "기억해둘 것"으로 1~2 bullet.
      - Output in Korean only, no preamble, no closing remark.

      ---
      {{prev}}
      ---

  - type: shell
    name: wrap-actions
    command: |
      node -e "process.stdout.write('=== 미팅 정리 (내부 검토용) ===\n' + {{prev}} + '\n=== 끝 ===\n')"

  - type: llm
    name: compose-followup
    prompt: |
      Convert the structured action sheet below into a polite Korean follow-up
      email the freelancer can send to the client today.

      Structure:
      1. 인사 한 줄 + 시간 내준 감사 한 줄 (예: "오늘 미팅 시간 내주셔서 감사합니다").
      2. **확정 사항 요약** — 미팅에서 결정된 것 2~3 bullet. 고객이 한 번 읽고 "맞다"라고 확인 가능한 톤.
      3. **다음 마일스톤** — 본인 다음 deliverable 1~2개 (마감일 명시). 고객이 보내줘야 할 것도 한 줄로.
      4. **별도 견적 안내 (있을 때)** — brief에 없던 추가 요청은 "별도 메일로 견적 보내드리겠습니다" 한 줄. 금액·근거는 메일에 포함하지 말 것 (별도 견적 메일은 quote-email 워크플로로 따로 작성).
      5. 마무리 한 줄 — "확인 부탁드리고, 추가 코멘트 있으시면 회신 부탁드립니다" + 본인 서명.

      Tone: 친근하지만 전문적인 존댓말. 내부 메모 용어("내부", "사양 변경" 등) 노출 금지.
      미팅 raw 노트의 "분위기/사이드" 정보(예: 잠재 추가 의뢰)는 이 메일에서 절대 언급하지 말 것 — 본인 비공식 메모일 뿐.

      Output in Korean only, no preamble outside the greeting.

      ---
      {{prev}}
      ---
