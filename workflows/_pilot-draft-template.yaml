name: _pilot-draft-template
description: "미팅 자리에서 귀사 사례 1건을 그 자리에서 customize하는 시드. {{...}} 자리표시자를 모두 채우고, 파일명을 workflows/<customer-slug>-draft.yaml 로 저장하면 listing에 자동 등장. (이 underscore-prefix 파일 자체는 listing/route에서 제외됨.)"
persona: "{{담당자_페르소나}}"
stressRelieved: "{{귀사가_겪는_반복_업무_한_줄}}"

# 미팅 자리 3분 가이드 — 비개발자도 함께 따라할 수 있는 흐름.
# 자세한 사용법은 README "Pilot 미팅 자리 customize 시드" 섹션 참조.
#
# 1단계 — 복사 (PowerShell·터미널 한 줄):
#     cp workflows/_pilot-draft-template.yaml workflows/<회사>-draft.yaml
#     (예: workflows/acme-draft.yaml)
#
# 2단계 — fixture 1건 두기:
#     본인 데이터 파일(회의록 .md / 매출 .csv / 문의 .csv / 결재 .md 중 하나)을
#     workflows/fixtures/<회사>-sample.<확장자> 로 저장.
#     (예: workflows/fixtures/acme-sample.md)
#
# 3단계 — 자리표시자 채우기:
#     아래 표의 본인 칸 5개를 채움. 영문 LLM 프롬프트 4개는 미팅 자리에서
#     운영자가 같이 채워드림.
#
# 완료 후 — 브라우저 listing(/) 새로고침 → 새 카드 자동 등장 → Run.
#
# ── 자리표시자 (9개) ───────────────────────────────────────────────────
# [본인이 채움 — 한국어 OK]
#   {{담당자_페르소나}}            예: "운영 / 사무관리"        → 카드 페르소나
#   {{귀사가_겪는_반복_업무_한_줄}} 예: "매주 동일한 양식 보고서 다시 쓰기"
#   {{customer-slug}}             예: "acme" (영문 소문자, 위 파일명과 일치)
#   {{확장자}}                     예: "md" / "csv" (위 fixture 확장자)
#   {{회사명}}                     예: "Acme"
#   {{워크플로우_제목}}            예: "주간 액션 정리"
#
# [운영자가 채움 — 영문 LLM 프롬프트]
#   {{입력_종류_영문}}             예: "a Korean weekly meeting note"
#   {{추출_목표_영문}}             예: "every action item with owner and deadline"
#   {{출력_형식_영문}}             예: "Korean Markdown table"
#   {{전달_채널_영문}}             예: "Slack-ready Korean message"

steps:
  # 1단계 — 입력 데이터 로드 (shell). cross-platform: Node로 파일을 stdout에.
  - type: shell
    name: load-input
    command: |
      node -e "process.stdout.write(require('fs').readFileSync('workflows/fixtures/{{customer-slug}}-sample.{{확장자}}','utf8'))"

  # 2단계 — LLM 핵심 추출. 영어 프롬프트 → 한국어 출력 규칙(feedback_demo_fixture_language).
  - type: llm
    name: extract-core
    prompt: |
      You are reading {{입력_종류_영문}}.

      Extract {{추출_목표_영문}}.

      Output:
      - A {{출력_형식_영문}}.
      - Korean only, no preamble, no trailing commentary.
      - Keep it tight: include only items grounded in the input below.

      ---
      {{prev}}
      ---

  # 3단계 — 결과 wrap (shell). cross-platform: Node로 헤더/푸터 출력.
  - type: shell
    name: wrap-report
    command: |
      node -e "process.stdout.write('=== {{회사명}} {{워크플로우_제목}} ===\n' + {{prev}} + '\n=== 끝 ===\n')"

  # 4단계 — LLM 채널 포맷 정리. 영어 프롬프트 → 한국어 출력.
  - type: llm
    name: format-for-channel
    prompt: |
      Reformat the following into a {{전달_채널_영문}}.

      Rules:
      - Korean only, friendly but professional tone.
      - Group / sort / annotate as the channel demands.
      - Keep under 130 Korean words total.
      - No preamble outside an optional one-line greeting.

      ---
      {{prev}}
      ---
