name: weekly-report-demo
description: 3-step demo — draft a weekly summary via LLM, wrap with shell, polish for Slack via LLM.
persona: 팀 리드 / 매니저
stressRelieved: 매주 같은 보고서를 처음부터 다시 쓰는 30분
steps:
  - type: llm
    name: draft
    prompt: |
      Draft a 3-bullet weekly status summary for an internal team.
      Use plausible placeholder content (project name "FlowAgent",
      topics like "MVP runner shipped", "Hono routes wired", "PRD approved").
      Output Markdown bullet points only — no preamble.

  - type: shell
    name: wrap
    command: |
      printf '=== Weekly Status ===\n%s\n=== End ===\n' "{{prev}}"

  - type: llm
    name: polish
    prompt: |
      Rewrite the following internal status report so it fits a Slack message:
      keep bullets, max 60 words total, friendly tone, no preamble.

      ---
      {{prev}}
      ---
