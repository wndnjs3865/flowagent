name: sns-replies
description: 인스타·블로그 한 주간 댓글·DM raw 목록에서 스팸·홍보를 걸러내고 카테고리별 답글 초안을 만들고 협업·견적 lead까지 별도 표시합니다.
persona: 자영업 B ★★★
stressRelieved: 매일 들어오는 인스타 DM·블로그 댓글에 일일이 답글 톤 맞추고 스팸 거르고 진짜 lead 놓치지 않는 피로
steps:
  - type: shell
    name: load-comments
    command: |
      node -e "process.stdout.write(require('fs').readFileSync('workflows/fixtures/sns-comments-2026-w23.md','utf8'))"

  - type: llm
    name: classify
    prompt: |
      You are a Korean 1인 자영업/freelancer reviewing this week's raw SNS
      comments and DMs (Instagram + 네이버 블로그). Classify every entry into
      EXACTLY one of these categories:

      - **협업·견적 lead** — 명백히 작업·견적을 문의하는 잠재 고객 (개인·법인 모두). lead로 따로 추적할 가치 있음.
      - **기존 고객·인간관계** — 이미 거래 중이거나 소개해준 사람의 인사·연락 (기존 미팅 follow-up, 지인 소개 등).
      - **감사·관심** — 짧은 칭찬·감사 댓글. 관심은 있지만 의뢰는 아님.
      - **질문 (의뢰 외)** — 단가·기술·진로 등 일반 질문. 답글 가치 있지만 영업 아님.
      - **항의·트집** — 부정적 코멘트. 감정 응대 금지, 사실 기반 한 줄.
      - **스팸·홍보 (절대 답글 금지)** — 광고 봇, 무관한 홍보 DM. 신고·차단 후보.

      Output a Korean Markdown table with header:
      | # | 출처 | 작성자/계정 | 카테고리 | 한 줄 요약 | 답글 우선순위 (높음/보통/낮음/X) |

      Rules:
      - 입력의 [N] 번호와 출처(인스타 DM·인스타 댓글·블로그 댓글)를 그대로 유지.
      - 스팸·홍보 카테고리는 우선순위 항상 "X" (답글 금지 표시).
      - 협업·견적 lead는 거의 항상 "높음" (빠른 응대가 매출 직결).
      - Sort: 우선순위 높음 → 보통 → 낮음 → X 순.
      - Output the table only — no preamble, no closing remark.
      - Output in Korean only.

      ---
      {{prev}}
      ---

  - type: shell
    name: wrap-classification
    command: |
      node -e "process.stdout.write('=== SNS 한 주 분류 (자동) ===\n' + {{prev}} + '\n=== 끝 ===\n')"

  - type: llm
    name: draft-replies
    prompt: |
      For every row in the classification table — EXCEPT 스팸·홍보 — write a
      short Korean reply draft the freelancer can send with light edits.

      Output structure:

      ## 협업·견적 lead (quote-email 워크플로로 후속 권장)
      For each lead row, write:
      ### [번호] 작성자
      - **답글 (이 채널 그대로)**: 3-5 lines. 친근 존댓말. 작업 톤·일정·예산 범위에 대한 1~2개 후속 질문 포함. 절대 가격 단가를 메시지에 직접 적지 말 것.
      - **다음 액션**: quote-email 워크플로로 견적 보낼 항목 한 줄 정리 (본인 메모용).

      ## 기존 고객·인간관계
      ### [번호] 작성자
      <캐주얼 답글 2-3 lines. 친근하고 빠른 톤. 이전 미팅·소개 맥락 반영.>

      ## 감사·관심
      ### [번호] 작성자
      <짧고 따뜻하게 1-2 lines. follow 권유 같은 영업 멘트 금지.>

      ## 질문 (의뢰 외)
      ### [번호] 작성자
      <질문에 정확히 답변 2-4 lines. 본인 글·페이지 링크는 자연스러울 때만.>

      ## 항의·트집
      ### [번호] 작성자
      <사실 기반 한 줄. 사과·변명·과한 친절 금지. 단가 안내 페이지 등 객관 정보로 마무리.>

      ## 차단 후보 (스팸·홍보)
      - 번호 + 작성자 한 줄씩 bullet. 답글 작성 금지, 신고·차단 대상으로 표시만.

      Rules:
      - 모든 답글은 한국어 + 친근하지만 전문적인 톤.
      - 광고 봇·홍보 카테고리는 답글 텍스트 생성 금지 — 차단 후보 섹션에만 나열.
      - Output in Korean only, no preamble outside the section headers.

      ---
      {{prev}}
      ---
