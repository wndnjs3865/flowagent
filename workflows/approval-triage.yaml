name: approval-triage
description: 결재함에 쌓인 요청을 자동승인/관리자 검토/정보 부족으로 분류하고 "오늘 처리할 결재" brief를 만듭니다.
persona: 총무 / 사무관리
stressRelieved: 결재함에 줄선 요청을 하나씩 읽고 판단하는 인지 부하
steps:
  - type: shell
    name: load-inbox
    command: |
      cat workflows/fixtures/inbox-approvals-2026-05.md

  - type: llm
    name: triage
    prompt: |
      You are reviewing today's approval queue for a Korean SMB office manager.

      For each REQ entry, decide exactly one verdict:
      - 자동승인 가능 — 가이드라인 한도 안 + 첨부서류·잔여 한도 충족 + 영향도 낮음
      - 관리자 검토 필요 — 한도 초과 / 정책 예외 / 영향도 큰 결정 (예: 신규 거래 시작, 대표 결재 요건)
      - 정보 부족 — 필요한 첨부서류·승인 요건이 빠져 추가 정보 요청이 필요한 경우

      Output a Korean Markdown table with header:
      | REQ | 요청자 | 금액·내용 | 판정 | 사유 한 줄 |

      Order: 자동승인 가능 먼저, 관리자 검토 필요 다음, 정보 부족 마지막.
      Output the table only — no preamble, no closing remark.
      Output in Korean only.

      ---
      {{prev}}
      ---

  - type: shell
    name: wrap-triage
    command: |
      printf '=== 결재 자동 분류 (오늘 기준) ===\n%s\n=== 끝 ===\n' "{{prev}}"

  - type: llm
    name: daily-brief
    prompt: |
      Convert the triage table below into a "오늘 처리할 결재 brief" for the
      office manager. Korean, Slack-pasteable.

      Structure:
      1. Single greeting line (예: "오늘 결재함 정리 결과 알려드려요 📋").
      2. *자동승인 가능* — 한 줄 총평 + 명단을 bullet (REQ 번호 + 한 줄).
      3. *관리자 검토 필요* — bullet마다 REQ + 검토 포인트 한 줄.
      4. *정보 부족* — bullet마다 REQ + 빠진 것 + 요청자에게 보낼 회신 문구 한 줄("@요청자, ...에 첨부 부탁드려요" 형식).

      Keep total length under 140 Korean words. Use friendly but crisp tone.
      Output in Korean only, no preamble outside the greeting line.

      ---
      {{prev}}
      ---
